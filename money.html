<script>
    // ===== Theme engine (shared by the pre-paint step and the app) =====
    (function () {
        const DEFAULTS = {
            currency: 'EUR',
            theme: 'dark',
            accent: '#34d399',
            bgMode: 'gradient',          // 'color' | 'gradient' | 'image'
            bgColor: '#0b1220',
            bgColor2: '#1e1b4b',
            bgImageUrl: '',
            bgBlur: 0,
            bgDim: 20,
            glass: 0.6,
            maskText: '~~~~',
            startHidden: false,
            blurChartsHidden: false,
            widgets: { kpis: true, projection: true, profit: true, history: true, categories: true, accounts: true, upcoming: true, recent: true },
            preview: 'projection',       // 'off' | 'projection' | 'profit'
            horizon: 60,
            includeAvgSpend: true
        };
        const mergeSettings = (s) => {
            s = s || {};
            return { ...DEFAULTS, ...s, widgets: { ...DEFAULTS.widgets, ...(s.widgets || {}) } };
        };
        const hexRgb = (h) => {
            h = String(h || '').replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const n = parseInt(h, 16);
            if (isNaN(n) || h.length !== 6) return '52,211,153';
            return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
        };
        const lum = (h) => {
            const [r, g, b] = hexRgb(h).split(',').map(Number).map(v => {
                v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };
        const applySettings = (s, bgData) => {
            const r = document.documentElement;
            r.dataset.theme = s.theme === 'light' ? 'light' : 'dark';
            r.style.setProperty('--accent', s.accent);
            r.style.setProperty('--accent-rgb', hexRgb(s.accent));
            r.style.setProperty('--on-accent', lum(s.accent) > 0.42 ? '#0b1220' : '#ffffff');
            r.style.setProperty('--glass', String(s.glass));
            r.style.setProperty('--bg-blur', (Number(s.bgBlur) || 0) + 'px');
            r.style.setProperty('--bg-dim', String((Number(s.bgDim) || 0) / 100));
            const bg = document.getElementById('bg');
            if (bg) {
                const img = s.bgMode === 'image' ? (bgData || s.bgImageUrl || '') : '';
                if (s.bgMode === 'image' && img) {
                    bg.style.background = `${s.bgColor} url("${img.replace(/"/g, '%22')}") center / cover no-repeat`;
                } else if (s.bgMode === 'gradient' || s.bgMode === 'image') {
                    bg.style.background = `radial-gradient(1100px 760px at 12% 8%, ${s.bgColor2}cc, transparent 62%), radial-gradient(900px 700px at 92% 96%, ${s.accent}2e, transparent 60%), linear-gradient(140deg, ${s.bgColor} 0%, ${s.bgColor2} 100%)`;
                } else {
                    bg.style.background = s.bgColor;
                }
            }
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', s.bgColor);
        };
        let cached = null, cachedBg = '';
        try { cached = JSON.parse(localStorage.getItem('money_settings') || 'null'); } catch (e) {}
        try { cachedBg = localStorage.getItem('money_bg') || ''; } catch (e) {}
        window.MONEY_THEME = { DEFAULTS, mergeSettings, applySettings, hexRgb, cached: mergeSettings(cached), cachedBg };
    })();
</script>

    const bal = {};
    people().forEach(p => { bal[p.id] = 0; });
    S.txs.forEach(t => {
        if (t.type === 'settlement') {
            if (t.fromPerson in bal) bal[t.fromPerson] += t.amount;
            if (t.toPerson in bal) bal[t.toPerson] -= t.amount;
            return;
        }
        if (t.type !== 'expense' || !t.split || !t.split.paidBy) return;

    cred.sort((a, b) => b.v - a.v); debt.sort((a, b) => b.v - a.v);
    const out = []; let i = 0, j = 0;
    while (i < debt.length && j < cred.length) {

        if (x > 0) out.push({ from: debt[i].id, to: cred[j].id, amount: x });

        });
                if (!S.ledgers.some(l => l.id === personalId) && !snap.metadata.fromCache && !creatingPersonal) {
            creatingPersonal = true;
            createLedger({ id: personalId, name: 'Personal', emoji: '👤', type: 'personal' })
                .then(() => { if (!S.ledgerId) switchLedger(personalId, { silent: true }); })
                .catch(handleErr).finally(() => { creatingPersonal = false; });
        }
        // A book that only exists locally (still being created) can't be read from the server yet,
        // so never open one until the server has confirmed it.
        const pending = new Set(snap.docs.filter(d => d.metadata.hasPendingWrites).map(d => d.id));
        const usable = (lid) => !!lid && S.ledgers.some(l => l.id === lid) && (lid === S.ledgerId || !pending.has(lid));
        let want = S.ledgerId || localStorage.getItem(lsKey('ledger'));
        if (!usable(want)) {
            want = usable(personalId) ? personalId : (S.ledgers.find(l => usable(l.id))?.id || null);
        }
        if (want !== S.ledgerId) switchLedger(want, { silent: true });
        ensureMyPerson();
        scheduleRender();
    }, handleErr);
}

function switchLedger(id, { silent = false } = {}) {
    unsubs.data.forEach(u => u()); unsubs.data = [];
    S.ledgerId = id;
    Object.assign(S, { accounts: [], txs: [], cats: [], bills: [], incomes: [], loaded: {} });
    S.txFilter = { q: '', account: '', category: '', type: '', month: '' };
    if (id) localStorage.setItem(lsKey('ledger'), id);
    if (!id) { scheduleRender(); return; }
    const map = { accounts: 'accounts', transactions: 'txs', categories: 'cats', bills: 'bills', incomes: 'incomes' };
    const sub = (name, key, tries = 0) => onSnapshot(col(name, id), (snap) => {
        if (S.ledgerId !== id) return;
        S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        S.loaded[name] = true;
        scheduleRender();
    }, (err) => {
        if (S.ledgerId !== id) return;
        // Right after a book is created the server can briefly refuse reads; retry a few times.
        if (err?.code === 'permission-denied' && tries < 3) {
            setTimeout(() => { if (S.ledgerId === id) unsubs.data.push(sub(name, key, tries + 1)); }, 1500 * (tries + 1));
            return;
        }
        handleErr(err);
    });
    Object.entries(map).forEach(([name, key]) => unsubs.data.push(sub(name, key)));
    if (S.view === 'split' && ledger()?.type !== 'split') S.view = 'dashboard';
    if (!silent) { const L = ledger(); if (L) toast(`Switched to ${L.emoji || ''} ${L.name}`.trim()); }
    scheduleRender();
}
const allLoaded = () => ['accounts', 'transactions', 'categories', 'bills', 'incomes'].every(k => S.loaded[k]);

async function createLedger({ id = null, name, emoji, type, emails = [], extraPeople = [] }) {
    const me = { id: 'p_' + rid(), name: S.user.displayName || S.email.split('@')[0], email: S.email, uid: S.user.uid, photo: S.user.photoURL || '' };
    const cleanEmails = [...new Set(emails.map(e => e.trim().toLowerCase()).filter(e => e && e !== S.email))];
    const ppl = [me, ...cleanEmails.map(e => ({ id: 'p_' + rid(), name: e.split('@')[0], email: e })), ...extraPeople];
    const ref = id ? ledgerRef(id) : doc(collection(db, 'money_ledgers'));
    await setDoc(ref, {
        name, emoji, type,
        ownerUid: S.user.uid, ownerEmail: S.email, ownerName: S.user.displayName || S.email,
        memberEmails: [S.email, ...cleanEmails],
        people: ppl,
        createdAt: nowISO()
    });
    const batch = writeBatch(db);
    DEFAULT_CATEGORIES.forEach((c, i) => batch.set(doc(col('categories', ref.id)), { ...c, order: i, createdAt: nowISO() }));
    await batch.commit();
    return ref.id;
}

function ensureMyPerson() {
    // In a split book, make sure the signed-in person is listed with their real name.
    const L = ledger();
    if (!L || L.type !== 'split' || ensuredPerson.has(L.id)) return;
    ensuredPerson.add(L.id);
    const list = (L.people || []).slice();
    const idx = list.findIndex(p => p.email === S.email);
    if (idx === -1) {
        list.push({ id: 'p_' + rid(), name: S.user.displayName || S.email.split('@')[0], email: S.email, uid: S.user.uid, photo: S.user.photoURL || '' });
    } else if (!list[idx].uid) {
        list[idx] = { ...list[idx], uid: S.user.uid, name: S.user.displayName || list[idx].name, photo: S.user.photoURL || '' };
    } else return;
    fire(updateDoc(ledgerRef(L.id), { people: list }));
}

// ---------- Charts ----------
function destroyCharts() { charts.forEach(c => { try { c.destroy(); } catch (e) {} }); charts = []; }
const chartsOK = () => typeof window.Chart !== 'undefined';
function baseOpts({ legend = false } = {}) {
    const tc = cssVar('--text-3'), lc = cssVar('--line');
    return {
        responsive: true, maintainAspectRatio: false, animation: { duration: 450 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
            legend: { display: legend, labels: { color: tc, boxWidth: 10, boxHeight: 10, usePointStyle: true, font: { family: 'Inter', size: 11 } } },
            tooltip: {
                backgroundColor: `rgba(${cssVar('--surface-rgb')},.96)`, titleColor: cssVar('--text'), bodyColor: cssVar('--text-2'),
                borderColor: lc, borderWidth: 1, padding: 10, cornerRadius: 10, titleFont: { family: 'Inter', weight: '700' }, bodyFont: { family: 'Inter' },
                callbacks: { label: (ctx) => `${ctx.dataset.label ? ctx.dataset.label + ': ' : ''}${moneyPlain(ctx.parsed.y)}` }
            }

            y: { grid: { color: lc }, border: { display: false }, ticks: { color: tc, maxTicksLimit: 5, font: { family: 'Inter', size: 11 }, callback: (v) => S.hidden ? maskText() : moneyPlain(v, { compact: true }) } }
        }
    };
}
function gradientFill(hex, a1 = .32) {
    return (ctx) => {
        const { chart } = ctx; const { ctx: c, chartArea } = chart;
        if (!chartArea) return rgba(hex, a1 / 2);
        const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        g.addColorStop(0, rgba(hex, a1)); g.addColorStop(1, rgba(hex, 0));
        return g;
    };
}
function mkChart(id, config) {
    const el = document.getElementById(id);
    if (!el || !chartsOK()) return null;
    const c = new Chart(el, config);
    charts.push(c);
    return c;
}
function projectionChart(id, p, compare = null, opts = {}) {
    const accent = S.settings.accent;
    const datasets = [];
    if (compare) datasets.push({ label: 'Before', data: compare.vals, borderColor: rgba(cssVar('--text') === '#0f172a' ? '#0f172a' : '#f1f5f9', .35), borderDash: [5, 5], borderWidth: 1.6, pointRadius: 0, tension: .25, fill: false });
    datasets.push({
        label: compare ? 'After' : 'Projected', data: p.vals, borderColor: accent, borderWidth: 2.4, tension: .25, fill: true,
        backgroundColor: gradientFill(accent),
        pointRadius: p.marks.map(m => m.length ? 3.5 : 0), pointBackgroundColor: accent, pointBorderWidth: 0, pointHoverRadius: 5
    });
    const o = baseOpts({ legend: !!compare });
    o.plugins.tooltip.callbacks.afterBody = (items) => { const m = p.marks[items[0].dataIndex]; return m && m.length ? m : ''; };
    if (opts.zeroLine !== false) {
        o.scales.y.grid.color = (ctx) => ctx.tick.value === 0 ? rgba('#f87171', .5) : cssVar('--line');
    }
    return mkChart(id, { type: 'line', data: { labels: p.labels, datasets }, options: o });
}

function txTitle(t) {
    if (t.note) return t.note;
    if (t.type === 'transfer') return `${accById(t.accountId)?.name || '?'} → ${accById(t.toAccountId)?.name || '?'}`;
    if (t.type === 'adjust') return 'Balance correction';
    if (t.type === 'settlement') return `${personName(personById(t.fromPerson))} paid ${personName(personById(t.toPerson))}`;
    return catById(t.categoryId)?.name || (t.type === 'income' ? 'Income' : 'Expense');

function txMeta(t) {

    else {
        if (t.note && t.type !== 'adjust') bits.push(catById(t.categoryId)?.name || 'Uncategorised');
        if (accById(t.accountId)) bits.push(accById(t.accountId).name);
    }
    if (t.billId) bits.push('Bill');
    if (isSplitLedger() && t.split?.paidBy) bits.push(`paid by ${personName(personById(t.split.paidBy))}`);
    return bits.join(' · ');
}

function viewTransactions() {
    const f = S.txFilter;
    const all = sortedTxs();
    if (!all.length) return `<div class="card glass">${emptyState('receipt', 'No transactions yet', 'Log money coming in, going out, or moving between your accounts.', `<button class="btn primary" data-action="add-tx">${icon('plus')}Add transaction</button>`)}</div>`;
    // Running total: computed over ALL transactions in order, so filters don't distort it.
    const bal0 = {}; S.accounts.forEach(a => { bal0[a.id] = Math.round(Number(a.startingBalance) || 0); });
    let run = f.account ? (bal0[f.account] || 0) : S.accounts.reduce((s, a) => s + (inTotal(a) ? bal0[a.id] : 0), 0);
    const runAfter = {};
    all.forEach(t => {
        run += f.account ? txEffects(t).filter(([id]) => id === f.account).reduce((s, [, d]) => s + d, 0) : totalDelta(txEffects(t));
        runAfter[t.id] = run;
    });
    const q = f.q.trim().toLowerCase();
    const shown = all.filter(t => {
        if (f.account && t.accountId !== f.account && t.toAccountId !== f.account) return false;
        if (f.category && t.categoryId !== f.category) return false;
        if (f.type && t.type !== f.type) return false;
        if (f.month && String(t.date).slice(0, 7) !== f.month) return false;
        if (q) {
            const hay = [t.note, catById(t.categoryId)?.name, accById(t.accountId)?.name, accById(t.toAccountId)?.name, String((t.amount || 0) / 100)].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    }).reverse();
    let inSum = 0, outSum = 0;
    shown.forEach(t => {
        if (f.account) { const d = txEffects(t).filter(([id]) => id === f.account).reduce((s, [, x]) => s + x, 0); if (d > 0) inSum += d; else outSum -= d; }
        else if (t.type === 'income') inSum += t.amount; else if (t.type === 'expense') outSum += t.amount;
    });
    const months = [...new Set(all.map(t => String(t.date).slice(0, 7)))].sort().reverse();
    let html = `<div class="toolbar">
        <div class="search">${icon('search')}<input id="flt-q" class="input" placeholder="Search notes, categories, amounts…" value="${esc(f.q)}" data-filter="q"></div>
        <select id="flt-acc" class="input" data-filter="account"><option value="">All accounts</option>${sortAccounts(S.accounts).map(a => `<option value="${esc(a.id)}" ${f.account === a.id ? 'selected' : ''}>${esc(a.name)}${a.archived ? ' (archived)' : ''}</option>`).join('')}</select>
        <select id="flt-cat" class="input" data-filter="category"><option value="">All categories</option>${sortCats(S.cats).map(c => `<option value="${esc(c.id)}" ${f.category === c.id ? 'selected' : ''}>${esc(c.emoji || '')} ${esc(c.name)}</option>`).join('')}</select>
        <select id="flt-type" class="input" data-filter="type"><option value="">All types</option>${['expense', 'income', 'transfer', 'adjust', 'settlement'].filter(t => t !== 'settlement' || isSplitLedger()).map(t => `<option value="${t}" ${f.type === t ? 'selected' : ''}>${{ expense: 'Expenses', income: 'Income', transfer: 'Transfers', adjust: 'Corrections', settlement: 'Settlements' }[t]}</option>`).join('')}</select>
        <select id="flt-month" class="input" data-filter="month"><option value="">All time</option>${months.map(m => `<option value="${m}" ${f.month === m ? 'selected' : ''}>${esc(monthLabel(m, { month: 'long', year: 'numeric' }))}</option>`).join('')}</select>
        ${(f.q || f.account || f.category || f.type || f.month) ? `<button class="btn ghost" data-action="clear-filters">${icon('x')}Clear</button>` : ''}
    </div>
    <div class="card glass">
        <div class="sumline"><span>${shown.length} transaction${shown.length === 1 ? '' : 's'}</span><span>In <b class="pos">${money(inSum)}</b></span><span>Out <b class="neg">${money(outSum)}</b></span>
        <span>Net <b>${money(inSum - outSum, { sign: true })}</b></span>
        ${f.account ? `<span>Balance <b>${money(balances()[f.account] || 0)}</b></span>` : ''}</div>`;
    if (!shown.length) html += emptyState('search-x', 'No matches', 'Try a different search or filter.');
    let lastDate = null;
    html += '<div class="list">';
    shown.forEach(t => {
        if (t.date !== lastDate) {
            lastDate = t.date;
            const dayNet = shown.filter(x => x.date === t.date).reduce((s, x) => s + (f.account ? txEffects(x).filter(([id]) => id === f.account).reduce((a, [, d]) => a + d, 0) : totalDelta(txEffects(x))), 0);
            html += `<div class="day-h"><span>${esc(fmtDate(t.date, { long: true }))}</span><span>${money(dayNet, { sign: true })}</span></div>`;
        }
        html += txRow(t, runAfter[t.id], f.account);
    });
    html += '</div></div>';
    return html;
}

let modalState = null;
function openModal({ title, body, footer = '', wide = false, onMount = null, onClose = null }) {
    closeModal();
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal-back"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        <div class="modal-h"><h2>${esc(title)}</h2><button class="btn sm icon ghost" data-close aria-label="Close">${icon('x')}</button></div>
        <div class="modal-b">${body}</div>
        ${footer ? `<div class="modal-f">${footer}</div>` : ''}
    </div></div>`;
    const back = root.firstElementChild, m = back.firstElementChild;
    modalState = { onClose, charts: [], refresh: null };
    back.addEventListener('mousedown', (e) => { if (e.target === back) back.dataset.down = '1'; });
    back.addEventListener('click', (e) => { if (e.target === back && back.dataset.down === '1') closeModal(); back.dataset.down = ''; });
    $$('[data-close]', m).forEach(b => b.addEventListener('click', closeModal));
    icons();
    if (onMount) onMount(m);
    const first = m.querySelector('[autofocus]');
    if (first && !matchMedia('(pointer: coarse)').matches) setTimeout(() => { if (!m.contains(document.activeElement)) first.focus(); }, 40);
    return m;
}
function closeModal() {
    if (!modalState) { $('#modal-root').innerHTML = ''; return; }
    modalState.charts.forEach(c => { try { c.destroy(); } catch (e) {} });
    const cb = modalState.onClose; modalState = null;
    $('#modal-root').innerHTML = '';
    if (cb) cb();
}
function refreshModalPreview() { if (modalState?.refresh) modalState.refresh(); }
function confirmBox(title, text, okLabel = 'Delete', danger = true) {
    return new Promise(res => {
        let done = false;
        openModal({
            title, body: `<div style="color:var(--text-2);line-height:1.5">${esc(text)}</div>`,
            footer: `<div class="spacer"></div><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cf-ok">${esc(okLabel)}</button>`,
            onMount: (m) => { $('#cf-ok', m).addEventListener('click', () => { done = true; closeModal(); res(true); }); },
            onClose: () => { if (!done) res(false); }
        });
    });
}
const accOptions = (sel, { allowNone = false, exclude = '' } = {}) =>
    (allowNone ? `<option value="">— None —</option>` : '') +

const catOptions = (kind, sel, allowNone = true) =>

const repeatOptions = (sel) => REPEATS.map(r => `<option value="${r.id}" ${r.id === (sel || 'none') ? 'selected' : ''}>${r.label}</option>`).join('');
const amountField = (id, val = '', autofocus = true) => `<div class="amount-in"><span class="cur">${esc(curSymbol())}</span><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(val)}" ${autofocus ? 'autofocus' : ''}></div>`;
const withErr = (m, msg) => { const e = $('.err', m); if (e) e.textContent = msg; };

// ---------- Transaction ----------
function openTxModal(existing = null, preset = {}) {
    if (existing && (existing.type === 'adjust' || existing.type === 'settlement')) return openSimpleTxModal(existing);
    const accs = activeAccounts();
    if (!accs.length) { toast('Add an account first'); return openAccountModal(); }
    const L = ledger(), split = L?.type === 'split';
    const st = {
        type: existing?.type || preset.type || 'expense',
        cat: existing?.categoryId ?? preset.categoryId ?? null,
        paidBy: existing?.split?.paidBy || myPerson()?.id || people()[0]?.id || '',
        among: existing?.split?.among || people().map(p => p.id),
        doSplit: existing ? !!existing.split : true
    };
    if (st.type === 'transfer' && accs.length < 2) st.type = 'expense';
    const fromId = existing?.accountId || preset.accountId || localStorage.getItem(lsKey('lastAcc')) || accs[0].id;
    const validFrom = accs.some(a => a.id === fromId) ? fromId : accs[0].id;
    const toId = existing?.toAccountId || accs.find(a => a.id !== validFrom)?.id || '';
    const showPreview = S.settings.preview !== 'off';
    const body = `
        <div class="seg types">${[['expense', 'Expense'], ['income', 'Income'], ['transfer', 'Transfer']].map(([v, l]) => `<button data-val="${v}" class="${st.type === v ? 'on' : ''}" ${v === 'transfer' && accs.length < 2 ? 'disabled title="Needs two accounts"' : ''}>${l}</button>`).join('')}</div>
        ${amountField('f-amount', existing ? centsToInput(existing.amount) : (preset.amount ? centsToInput(preset.amount) : ''))}
        <div class="row wrap-sm">
            <div class="field"><span class="lbl" id="f-acc-lbl">From</span><select class="input" id="f-acc">${accOptions(validFrom)}</select></div>
            <div class="field" id="f-to-wrap"><span class="lbl">To</span><select class="input" id="f-to">${accOptions(toId)}</select></div>
        </div>
        <div id="f-denoms" class="dn-host hidden"></div>
        <div class="field" id="f-cat-wrap"><span class="lbl">Category</span><div class="chips" id="f-cats"></div></div>
        <div class="row wrap-sm">
            <div class="field" style="flex:0 0 160px"><span class="lbl">Date</span><input type="date" class="input" id="f-date" value="${esc(existing?.date || preset.date || todayISO())}"></div>
            <div class="field"><span class="lbl">Note / label</span><input class="input" id="f-note" maxlength="120" placeholder="What was it for?" value="${esc(existing?.note || preset.note || '')}"></div>
        </div>
        ${split ? `<div class="field" id="f-split-wrap"><div style="display:flex;align-items:center;justify-content:space-between"><span class="lbl">Split this</span><label class="switch"><input type="checkbox" id="f-split" ${st.doSplit ? 'checked' : ''}><span></span></label></div>
            <div id="f-split-body" class="${st.doSplit ? '' : 'hidden'}" style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
                <div class="field"><span class="lbl">Paid by</span><select class="input" id="f-paidby">${people().map(p => `<option value="${esc(p.id)}" ${p.id === st.paidBy ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select></div>
                <div class="field"><span class="lbl">Split equally between</span><div class="chips" id="f-among">${people().map(p => `<button type="button" class="chip ${st.among.includes(p.id) ? 'on' : ''}" data-pid="${esc(p.id)}">${esc(personName(p))}</button>`).join('')}</div><div class="help" id="f-share"></div></div>
            </div></div>` : ''}
        ${showPreview ? `<div class="preview"><div class="lbl" style="margin-bottom:8px">${S.settings.preview === 'profit' ? 'This month’s profit' : 'Projection'} — live preview</div><div class="pv-lines" id="pv-lines"></div><div class="chart sm"><canvas id="pv-canvas"></canvas></div></div>` : ''}
        <div class="err"></div>`;
    const footer = `${existing ? `<button class="btn danger" id="f-del">${icon('trash-2')}Delete</button>` : ''}<div class="spacer"></div><button class="btn" data-close>Cancel</button><button class="btn primary" id="f-save">${existing ? 'Save' : 'Add'}</button>`;
    openModal({
        title: existing ? 'Edit transaction' : 'New transaction', body, footer, wide: showPreview,
        onMount: (m) => {
            const el = (id) => $('#' + id, m);
            let pvChart = null;
            const picker = createDenomPicker(el('f-denoms'), existing, { type: () => st.type, from: () => el('f-acc').value, to: () => el('f-to').value, amount: el('f-amount'), onChange: () => refresh() });
            const syncType = () => {
                $$('.seg.types button', m).forEach(b => b.classList.toggle('on', b.dataset.val === st.type));
                el('f-acc-lbl').textContent = st.type === 'income' ? 'Into account' : st.type === 'transfer' ? 'From' : 'Paid from';
                el('f-to-wrap').classList.toggle('hidden', st.type !== 'transfer');
                el('f-cat-wrap').classList.toggle('hidden', st.type === 'transfer');
                if (el('f-split-wrap')) el('f-split-wrap').classList.toggle('hidden', st.type !== 'expense');
                const kind = st.type === 'income' ? 'income' : 'expense';
                const list = catsOf(kind);
                if (st.type !== 'transfer' && (!st.cat || !list.some(c => c.id === st.cat))) st.cat = list[0]?.id || null;
                el('f-cats').innerHTML = list.map(c => `<button type="button" class="chip ${c.id === st.cat ? 'on' : ''}" data-cid="${esc(c.id)}"><span>${esc(c.emoji || '')}</span>${esc(c.name)}</button>`).join('')
                    || `<div class="help">No ${kind} categories yet — add some under Categories.</div>`;
                icons();
                picker.render();
                refresh();
            };
            const draft = () => {
                const amount = parseMoney(el('f-amount').value);
                return {
                    type: st.type, amount: amount > 0 ? amount : 0,
                    accountId: el('f-acc').value, toAccountId: st.type === 'transfer' ? el('f-to').value : null,
                    categoryId: st.type === 'transfer' ? null : st.cat, date: el('f-date').value || todayISO()
                };
            };
            const refresh = () => {
                if (el('f-share')) {
                    const a = parseMoney(el('f-amount').value);
                    el('f-share').textContent = a > 0 && st.among.length ? `${moneyPlain(Math.round(a / st.among.length), { force: true })} each` : '';
                }
                if (!showPreview) return;
                const d = draft();
                const oldEff = existing ? txEffects(existing) : [];
                const newEff = d.amount > 0 && !(d.type === 'transfer' && d.accountId === d.toAccountId) ? txEffects(d) : [];
                const bal = balances(); const deltas = {};
                newEff.forEach(([id, x]) => { deltas[id] = (deltas[id] || 0) + x; });
                oldEff.forEach(([id, x]) => { deltas[id] = (deltas[id] || 0) - x; });
                const dTotal = totalDelta(newEff) - totalDelta(oldEff);
                const total = totalOf(bal);
                const line = (k, a, b) => `<div class="pv-line"><span class="k">${esc(k)}</span><span class="v">${money(a)}<span class="arr">→</span><span class="${b > a ? 'pos' : b < a ? 'neg' : ''}">${money(b)}</span></span></div>`;
                let lines = Object.entries(deltas).filter(([, x]) => x).map(([id, x]) => line(accById(id)?.name || 'Account', bal[id] || 0, (bal[id] || 0) + x)).join('');
                if (S.settings.preview === 'profit') {
                    const mk = todayISO().slice(0, 7);
                    const before = monthStats(mk);
                    const extra = [];
                    if (existing) extra.push({ ...existing, __sign: -1 });
                    if (d.amount > 0) extra.push(d);
                    const after = monthStats(mk, extra);
                    lines += line(`${monthLabel(mk, { month: 'long' })} profit`, before.net, after.net);
                    const data = { labels: ['Income', 'Expenses', 'Profit'], datasets: [
                        { label: 'Before', data: [before.inc, before.exp, before.net], backgroundColor: rgba('#94a3b8', .45), borderRadius: 6, maxBarThickness: 34 },
                        { label: 'After', data: [after.inc, after.exp, after.net], backgroundColor: [rgba('#4ade80', .8), rgba('#f87171', .8), S.settings.accent], borderRadius: 6, maxBarThickness: 34 }
                    ] };
                    if (!pvChart && chartsOK()) {

// ---------- Notes & coins breakdown ----------
// Counts per account = the last count (account.denoms) + every transaction's notes/coins
// (tx.denoms for its account, tx.toDenoms for the "to" side of a transfer). Signed: + in, − out.
const DENOMS = {
    coins: [200, 100, 50, 20, 10, 5, 2, 1],
    cash: [5000, 2000, 1000, 500]
};
const hasDenoms = (a) => !!a && !!DENOMS[a.type];
const denomLabel = (c) => c >= 100 ? `${curSymbol()}${c / 100}` : `${c}c`;
const denomFace = (c) => ({ 200: 'f-bi2', 100: 'f-bi1', 50: 'f-gold', 20: 'f-gold', 10: 'f-gold', 5: 'f-copper', 2: 'f-copper', 1: 'f-copper', 5000: 'f-n50', 2000: 'f-n20', 1000: 'f-n10', 500: 'f-n5' })[c] || 'f-gold';
const denomTotal = (a, counts) => (DENOMS[a?.type] || []).reduce((s, v) => s + v * (Number(counts?.[v]) || 0), 0);
let dcMemo = { txs: null, accs: null, val: null };
function allDenomCounts() {
    if (dcMemo.txs === S.txs && dcMemo.accs === S.accounts) return dcMemo.val;
    const out = {};
    S.accounts.forEach(a => {
        if (!hasDenoms(a)) return;
        const counts = {};
        DENOMS[a.type].forEach(v => { counts[v] = Number(a.denoms?.[v]) || 0; });
        out[a.id] = { counts, known: !!a.denoms };
    });
    const apply = (id, map) => {
        const o = out[id]; if (!o || !map) return;
        Object.entries(map).forEach(([k, n]) => { if (k in o.counts) { o.counts[k] += Number(n) || 0; o.known = true; } });
    };
    S.txs.forEach(t => { apply(t.accountId, t.denoms); apply(t.toAccountId, t.toDenoms); });
    dcMemo = { txs: S.txs, accs: S.accounts, val: out };
    return out;
}
// Counts for one account, optionally ignoring one transaction (used while editing it).
function denomCountsFor(accId, ignoreTx = null) {
    const dc = allDenomCounts()[accId]; if (!dc) return null;
    const counts = { ...dc.counts };
    if (ignoreTx) {
        [[ignoreTx.accountId, ignoreTx.denoms], [ignoreTx.toAccountId, ignoreTx.toDenoms]].forEach(([id, map]) => {
            if (id === accId && map) Object.entries(map).forEach(([k, n]) => { if (k in counts) counts[k] -= Number(n) || 0; });
        });
    }
    return { counts, known: dc.known };
}
const denomChip = (a, v, n, cls = '') => `<span class="denom-chip ${cls}"><i class="${a.type === 'cash' ? 'note' : ''} ${denomFace(v)}"></i>${S.hidden ? esc(maskText()) : n} × ${esc(denomLabel(v))}</span>`;
function denomChips(a, bal) {
    if (!hasDenoms(a)) return '';
    const word = a.type === 'cash' ? 'notes' : 'coins';
    const dc = allDenomCounts()[a.id];
    if (!dc || !dc.known) return `<div class="denom-chips"><span class="help">Tap to count your ${word}</span></div>`;
    const list = DENOMS[a.type].filter(v => dc.counts[v]);
    let html = `<div class="denom-chips">${list.length
        ? list.map(v => denomChip(a, v, dc.counts[v], dc.counts[v] < 0 ? 'neg' : '')).join('')
        : `<span class="help">No ${word} left</span>`}</div>`;
    const diff = denomTotal(a, dc.counts) - bal;
    if (diff) html += `<div class="help warn" style="margin-top:6px">Count is ${money(diff, { sign: true })} off the balance — tap to recount</div>`;
    return html;
}
// The little row of notes/coins shown under a transaction in lists.
function denomLine(t) {
    const group = (accId, map, wantSign) => {
        const a = accById(accId); const main = [], other = [];
        if (hasDenoms(a) && map) DENOMS[a.type].forEach(v => {
            const n = Number(map[v]) || 0; if (!n) return;
            (Math.sign(n) === wantSign ? main : other).push(denomChip(a, v, Math.abs(n)));
        });
        return { a, main, other };
    };
    let html = '';
    if (t.type === 'expense' || t.type === 'income') {
        const g = group(t.accountId, t.denoms, t.type === 'income' ? 1 : -1);
        html = g.main.join('') + (g.other.length ? `<span class="dn-sep">change</span>${g.other.join('')}` : '');
    } else if (t.type === 'transfer') {
        const f = group(t.accountId, t.denoms, -1), to = group(t.toAccountId, t.toDenoms, 1);
        const norm = (map, sign) => JSON.stringify(Object.entries(map || {}).map(([k, n]) => [k, sign * n]).sort());
        const mirrored = f.a?.type === to.a?.type && norm(t.denoms, -1) === norm(t.toDenoms, 1);
        html = f.main.join('');
        if (to.main.length && !(mirrored && f.main.length)) html += `${f.main.length ? '<span class="dn-sep">→</span>' : ''}${to.main.join('')}`;
    }
    return html ? `<div class="dn-line">${html}</div>` : '';
}

        onMount: (m) => {
            const sync = () => {
                let pieces = 0;
                list.forEach(v => { pieces += counts[v]; $(`[data-sub="${v}"]`, m).innerHTML = counts[v] ? money(counts[v] * v) : '<span class="muted">—</span>'; });
                const total = denomTotal(a, counts), diff = total - bal;

                $('#dn-total', m).innerHTML = money(total);

            };

            $$('[data-count]', m).forEach(i => {
                i.addEventListener('focus', () => i.select());

            });

            $('#dn-save', m).addEventListener('click', () => {

                const base = {}; list.forEach(v => { base[v] = (Number(a.denoms?.[v]) || 0) + counts[v] - (Number(derived[v]) || 0); });
                const diff = denomTotal(a, counts) - bal;

                    fire(addDoc(col('transactions'), { type: 'adjust', amount: diff, accountId: a.id, date: todayISO(), note: isCash ? 'Cash count' : 'Coin count', createdAt: nowISO(), createdBy: S.email }));
                }
                closeModal();
                toast(syncBal ? `${a.name} counted · balance updated` : `${a.name} counted`);
            });
            sync();
        }
    });
}
// Notes/coins picker inside the transaction form.
// ctx: { type(), from(), to(), amount: <input>, onChange() }
function createDenomPicker(host, existing, ctx) {
    const blank = () => ({ type: null, pieces: {}, change: {}, showChange: false });
    const st = { from: blank(), to: blank(), manual: !!existing && !(existing.denoms || existing.toDenoms), touchedTo: !!existing?.toDenoms };
    if (existing) {
        const load = (side, accId, map, sign) => {
            const a = accById(accId); if (!hasDenoms(a)) return;
            side.type = a.type;
            Object.entries(map || {}).forEach(([k, n]) => {
                n = Number(n) || 0;
                if (n * sign > 0) side.pieces[k] = Math.abs(n);
                else if (n) { side.change[k] = Math.abs(n); side.showChange = true; }
            });
        };
        load(st.from, existing.accountId, existing.denoms, existing.type === 'income' ? 1 : -1);
        if (existing.type === 'transfer') load(st.to, existing.toAccountId, existing.toDenoms, 1);
    }
    const sum = (map) => Object.entries(map).reduce((s, [k, n]) => s + Number(k) * n, 0);
    const changeOf = (d) => d.allowChange ? st[d.key].change : {};
    const any = (d) => Object.values(st[d.key].pieces).some(n => n > 0) || Object.values(changeOf(d)).some(n => n > 0);
    const net = (d) => sum(st[d.key].pieces) - sum(changeOf(d));
    const sides = () => {
        const type = ctx.type();
        const fromA = accById(ctx.from()); const toA = type === 'transfer' ? accById(ctx.to()) : null;
        const out = [];
        if (hasDenoms(fromA)) out.push({ key: 'from', a: fromA, sign: type === 'income' ? 1 : -1, allowChange: type === 'expense', title: type === 'income' ? 'What did you put in?' : type === 'transfer' ? `Taken out of ${fromA.name}` : 'Paid with' });
        if (hasDenoms(toA) && toA.id !== fromA?.id) out.push({ key: 'to', a: toA, sign: 1, allowChange: false, title: `Put into ${toA.name}` });
        return out;
    };
    const syncType = (side, a) => {
        if (!a) return;
        if (side.type && side.type !== a.type) { side.pieces = {}; side.change = {}; side.showChange = false; }
        side.type = a.type;
    };
    const tiles = (d, kind, showHave) => {
        const side = st[d.key]; const isCash = d.a.type === 'cash';
        const have = showHave ? denomCountsFor(d.a.id, existing) : null;
        return `<div class="dn-grid ${isCash ? 'notes' : ''}">${DENOMS[d.a.type].map(v => {
            const n = side[kind][v] || 0; const lab = esc(denomLabel(v));
            const h = have && have.known ? have.counts[v] : null;
            return `<div class="dn-tile ${n ? 'on' : ''}">
                ${n ? `<button type="button" class="dn-sub" data-side="${d.key}" data-kind="${kind}" data-v="${v}" aria-label="One less ${lab}">−</button>` : ''}
                <button type="button" class="dn-add" data-side="${d.key}" data-kind="${kind}" data-v="${v}" aria-label="Add a ${lab}">
                    <span class="denom-face sm ${isCash ? 'note' : 'coin'} ${denomFace(v)}">${lab}</span>${n ? `<span class="dn-badge">${n}</span>` : ''}
                </button>
                ${h != null && !S.hidden ? `<span class="dn-have ${n > h ? 'short' : ''}">have ${Math.max(0, h)}</span>` : ''}
            </div>`;
        }).join('')}</div>`;
    };
    const render = () => {
        const list = sides();
        syncType(st.from, list.find(d => d.key === 'from')?.a);
        syncType(st.to, list.find(d => d.key === 'to')?.a);
        host.innerHTML = list.map(d => {
            const side = st[d.key]; const word = d.a.type === 'cash' ? 'notes' : 'coins';
            const ch = sum(changeOf(d));
            return `<div class="dn-tray">
                <div class="dn-head"><span class="lbl">${esc(d.title)}</span><span class="dn-sum">${any(d) ? money(net(d)) : '<span class="muted" style="font-weight:500;font-size:12px">optional</span>'}</span></div>
                ${tiles(d, 'pieces', d.sign < 0)}
                ${d.allowChange ? (side.showChange
                    ? `<div class="dn-head"><span class="lbl">Change back</span>${ch ? `<span class="dn-sum pos">${money(ch, { sign: true })}</span>` : ''}</div>${tiles(d, 'change', false)}`
                    : `<button type="button" class="btn sm ghost" data-dn-change style="align-self:flex-start">${icon('plus')}Got change back</button>`) : ''}
                ${!any(d) ? `<div class="help">Tap the ${word} you ${d.sign > 0 ? 'added' : 'used'} so your ${word} count stays right.</div>` : ''}
            </div>`;
        }).join('');
        host.classList.toggle('hidden', !list.length);
        icons();
    };
    const autoAmount = () => {
        if (st.manual) return;
        const first = sides().find(d => any(d));
        const v = first ? net(first) : 0;
        ctx.amount.value = v > 0 ? (v / 100).toFixed(2) : '';
    };
    host.addEventListener('click', (e) => {
        if (e.target.closest('[data-dn-change]')) { st.from.showChange = true; render(); return; }
        const b = e.target.closest('.dn-add, .dn-sub'); if (!b) return;
        const key = b.dataset.side, kind = b.dataset.kind, v = b.dataset.v;
        const side = st[key];
        side[kind][v] = Math.max(0, (side[kind][v] || 0) + (b.classList.contains('dn-add') ? 1 : -1));
        if (!side[kind][v]) delete side[kind][v];
        const list = sides();
        if (key === 'to') st.touchedTo = true;
        else if (ctx.type() === 'transfer' && !st.touchedTo && list.some(d => d.key === 'to') && st.to.type === st.from.type) st.to.pieces = { ...st.from.pieces };
        autoAmount(); render(); ctx.onChange();
    });
    ctx.amount.addEventListener('input', () => { st.manual = ctx.amount.value.trim() !== ''; });
    const validate = (amount) => {
        for (const d of sides()) {
            if (!any(d)) continue;
            const v = net(d);
            if (v !== amount) return `The ${d.a.type === 'cash' ? 'notes' : 'coins'} for ${d.a.name} add up to ${moneyPlain(v, { force: true })}, but the amount is ${moneyPlain(amount, { force: true })}.`;
        }
        return null;
    };
    const payload = () => {
        const out = { denoms: null, toDenoms: null };
        sides().forEach(d => {
            if (!any(d)) return;
            const map = {};
            Object.entries(st[d.key].pieces).forEach(([k, n]) => { if (n) map[k] = (map[k] || 0) + d.sign * n; });
            Object.entries(changeOf(d)).forEach(([k, n]) => { if (n) map[k] = (map[k] || 0) - d.sign * n; });
            Object.keys(map).forEach(k => { if (!map[k]) delete map[k]; });
            out[d.key === 'from' ? 'denoms' : 'toDenoms'] = Object.keys(map).length ? map : null;
        });
        return out;
    };
    return { render, validate, payload };
}

// ---------- Background upload ----------
function compressImage(file, maxW = 1920) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onerror = reject;
        r.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                let w = img.width, h = img.height, max = maxW;
                const c = document.createElement('canvas'); const ctx = c.getContext('2d');
                const draw = () => { w = img.width; h = img.height; if (w > max) { h = Math.round(h * max / w); w = max; } c.width = w; c.height = h; ctx.drawImage(img, 0, 0, w, h); };
                draw();
                let q = 0.82, out = c.toDataURL('image/jpeg', q);
                while (out.length > 850000 && q > 0.3) { q -= 0.12; out = c.toDataURL('image/jpeg', q); }
                while (out.length > 850000 && max > 600) { max = Math.round(max * 0.75); draw(); out = c.toDataURL('image/jpeg', 0.7); }
                resolve(out);
            };
            img.src = r.result;
        };
        r.readAsDataURL(file);
    });
}

// ---------- Export ----------
function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCSV() {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['Date', 'Type', 'Amount', 'Account', 'To account', 'Category', 'Note'].map(q).join(',')];
    sortedTxs().forEach(t => rows.push([t.date, t.type, ((t.type === 'expense' ? -1 : 1) * t.amount / 100).toFixed(2), accById(t.accountId)?.name, accById(t.toAccountId)?.name, catById(t.categoryId)?.name, t.note].map(q).join(',')));
    download(`money-${(ledger()?.name || 'book').replace(/\W+/g, '-').toLowerCase()}-${todayISO()}.csv`, rows.join('\n'), 'text/csv');
}

function toast(msg, { action = null, error = false, ms = 3800 } = {}) {    
    if ([...$('#toasts').children].some(x => x.dataset.msg === msg)) return;
    const t = document.createElement('div');
    t.dataset.msg = msg;
    t.className = 'toast' + (error ? ' error' : '');
    t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
    if (action) t.querySelector('button').addEventListener('click', () => { action.fn(); t.remove(); });
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, action ? Math.max(ms, 6000) : ms);
}

// =====================================================================
// Events
// =====================================================================
const actions = {
    'signin': () => doSignIn(),
    'signout': async () => { if (await confirmBox('Sign out?', 'Your data stays saved in your Google account.', 'Sign out', false)) signOut(auth); },
    'nav': (el) => { S.view = el.dataset.view; localStorage.setItem('money_view', S.view); $('#app').classList.remove('nav-open'); $('#view').scrollTop = 0; render(); },
    'switch-ledger': (el) => { if (el.dataset.id !== S.ledgerId) switchLedger(el.dataset.id); $('#app').classList.remove('nav-open'); },
    'new-ledger': () => { $('#app').classList.remove('nav-open'); openNewLedgerModal(); },
    'toggle-hide': () => setHidden(!S.hidden),
    'collapse': () => { const on = localStorage.getItem('money_sidebar_collapsed') !== '1'; localStorage.setItem('money_sidebar_collapsed', on ? '1' : '0'); applySidebarCollapse(); renderSidebar(); setTimeout(() => charts.forEach(c => c.resize()), 280); },
    'open-nav': () => $('#app').classList.add('nav-open'),
    'close-nav': () => $('#app').classList.remove('nav-open'),
    'add-tx': (el) => openTxModal(null, { type: el.dataset.type, accountId: el.dataset.account }),
    'edit-tx': (el) => { const t = S.txs.find(x => x.id === el.dataset.id); if (t) openTxModal(t); },
    'add-account': () => openAccountModal(),
    'edit-account': (el) => { const a = accById(el.dataset.id); if (a) openAccountModal(a); },
    'open-denoms': (el) => { const a = accById(el.dataset.id); if (a && hasDenoms(a)) openDenomModal(a); },
    'set-balance': (el) => { const a = accById(el.dataset.id); if (a) openSetBalanceModal(a); },
    'filter-account': (el) => { S.txFilter = { q: '', account: el.dataset.id, category: '', type: '', month: '' }; S.view = 'transactions'; localStorage.setItem('money_view', S.view); render(); },
    'clear-filters': () => { S.txFilter = { q: '', account: '', category: '', type: '', month: '' }; renderView(); },
    'add-bill': () => openPlanModal('bill'),
    'edit-bill': (el) => { const b = S.bills.find(x => x.id === el.dataset.id); if (b) openPlanModal('bill', b); },
    'pay-bill': (el) => { const b = S.bills.find(x => x.id === el.dataset.id); if (b) openSettleItemModal('bill', b); },
    'add-income': () => openPlanModal('income'),
    'edit-income': (el) => { const i = S.incomes.find(x => x.id === el.dataset.id); if (i) openPlanModal('income', i); },
    'receive-income': (el) => { const i = S.incomes.find(x => x.id === el.dataset.id); if (i) openSettleItemModal('income', i); },
    'set-paycheck': () => openPaycheckModal(),
    'toggle-paid': () => { S.showPaidBills = !S.showPaidBills; renderView(); },
    'add-cat': (el) => openCatModal(null, el.dataset.kind || 'expense'),
    'edit-cat': (el) => { const c = catById(el.dataset.id); if (c) openCatModal(c); },
    'add-person': () => openAddPersonModal(),
    'remove-person': async (el) => {
        const L = ledger(); const p = personById(el.dataset.id); if (!p) return;
        if (!await confirmBox(`Remove ${personName(p)}?`, `They'll no longer appear in splits${p.email ? ' and will lose access to this book' : ''}. Past split amounts involving them are ignored.`, 'Remove')) return;
        const patch = { people: (L.people || []).filter(x => x.id !== p.id) };
        if (p.email && L.ownerUid === S.user.uid) patch.memberEmails = arrayRemove(p.email);
        fire(updateDoc(ledgerRef(), patch), 'Removed');
    },
    'settle': (el) => openSettleModal(el.dataset.from, el.dataset.to, Number(el.dataset.amount)),
    'set': (el) => {
        const key = el.dataset.key, val = el.dataset.num ? Number(el.dataset.val) : el.dataset.val;
        const patch = { [key]: val };
        // Switching panel theme: if the background is still on the stock palette, swap it too so text stays readable.
        const DARK_BG = ['#0b1220', '#1e1b4b'], LIGHT_BG = ['#e0e7ff', '#fce7f3'];
        const cur = [S.settings.bgColor.toLowerCase(), S.settings.bgColor2.toLowerCase()];
        if (key === 'theme' && val === 'light' && cur.join() === DARK_BG.join()) Object.assign(patch, { bgColor: LIGHT_BG[0], bgColor2: LIGHT_BG[1] });
        if (key === 'theme' && val === 'dark' && cur.join() === LIGHT_BG.join()) Object.assign(patch, { bgColor: DARK_BG[0], bgColor2: DARK_BG[1] });
        updateSettings(patch);
    },
    'upload-bg': () => $('#bg-file').click(),
    'remove-bg': () => {
        fire(deleteDoc(doc(db, 'money_users', S.user.uid, 'assets', 'background')));
        S.bgData = ''; try { localStorage.removeItem('money_bg'); } catch (e) {}
        updateSettings({ bgImageUrl: '', bgMode: 'gradient' });
    },
    'save-ledger': () => {
        const name = $('#ledger-name').value.trim(); if (!name) return toast('Give the book a name', { error: true });
        fire(updateDoc(ledgerRef(), { name, emoji: $('#ledger-emoji').value.trim() || '📒' }), 'Book renamed');
    },
    'share': () => {
        const L = ledger(); const email = $('#share-email').value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('That email doesn\'t look right', { error: true });
        if ((L.memberEmails || []).includes(email)) return toast('Already shared with them');
        const patch = { memberEmails: arrayUnion(email) };
        if (L.type === 'split' && !(L.people || []).some(p => p.email === email)) patch.people = [...(L.people || []), { id: 'p_' + rid(), name: email.split('@')[0], email }];
        fire(updateDoc(ledgerRef(), patch), `Shared with ${email}`);
    },
    'unshare': async (el) => {
        const email = el.dataset.email;
        if (await confirmBox('Remove access?', `${email} will no longer see this book.`, 'Remove')) fire(updateDoc(ledgerRef(), { memberEmails: arrayRemove(email) }), 'Access removed');
    },
    'leave-ledger': async () => {
        const L = ledger();
        if (!await confirmBox(`Leave ${L.name}?`, 'You\'ll stop seeing this book until someone adds you again.', 'Leave')) return;
        const id = L.id;
        switchLedger('personal_' + S.user.uid, { silent: true });
        fire(updateDoc(ledgerRef(id), { memberEmails: arrayRemove(S.email) }), 'Left the book');
    },
    'delete-ledger': () => deleteLedger(ledger()),
    'export-csv': () => exportCSV(),
    'export-json': () => exportJSON()
};
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
});

// Settings inputs + filters (delegated)
const handleSettingInput = (el, isChange) => {
    const key = el.dataset.set;
    const wantsChange = el.dataset.on === 'change';
    if (wantsChange && !isChange) return;
    let val;
    if (el.type === 'checkbox') val = el.checked;
    else if (el.type === 'range') { val = Number(el.value); if (el.dataset.scale) val = val / Number(el.dataset.scale); }
    else val = el.value;
    if (el.type === 'range') {
        const tag = $(`[data-val-for="${key}"]`);
        if (tag) tag.textContent = el.value + (el.dataset.unit || '');
    }
    if (key === 'maskText' && !String(val).trim()) return;
    if (key.startsWith('widgets.')) return updateSettings({ widgets: { [key.slice(8)]: val } });
    // Sliders/colour pickers update live without rebuilding the page; the rest re-render.
    const live = el.type === 'range' || el.type === 'color';
    updateSettings({ [key]: val }, { rerender: !live || isChange });
};
document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.set) return handleSettingInput(el, false);
    if (el.dataset.filter === 'q') { S.txFilter.q = el.value; renderView(); }
});
document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.matches('[data-hide-toggle]')) return setHidden(el.checked);
    if (el.dataset.set) return handleSettingInput(el, true);
    if (el.dataset.filter && el.dataset.filter !== 'q') { S.txFilter[el.dataset.filter] = el.value; renderView(); }
    if (el.id === 'bg-file' && el.files[0]) {
        const f = el.files[0]; el.value = '';
        if (!f.type.startsWith('image/')) return toast('That file isn\'t an image', { error: true });
        toast('Uploading background…');
        compressImage(f).then(data => {
            S.bgData = data;
            try { localStorage.setItem('money_bg', data); } catch (err) {}
            updateSettings({ bgMode: 'image' });
            fire(setDoc(doc(db, 'money_users', S.user.uid, 'assets', 'background'), { data, updatedAt: nowISO() }), 'Background saved');
        }).catch(() => toast('Couldn\'t read that image', { error: true }));
    }
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalState) { closeModal(); return; }
    if (!S.user || modalState || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); setHidden(!S.hidden); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openTxModal(); }
});
// Keep "Today"-based numbers fresh if the tab stays open past midnight.
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); scheduleRender(); } }, 60000);
</script>
